services:
  kazumi:
    build: .
    image: kazumi-web:local
    restart: unless-stopped
    init: true
    ports:
      - '${HOST_BIND:-0.0.0.0}:${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      ALLOW_PRIVATE_NETWORK: 'false'
      DNS_OVER_HTTPS_URL: '${DNS_OVER_HTTPS_URL:-}'
    volumes:
      - kazumi-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

volumes:
  kazumi-data:
