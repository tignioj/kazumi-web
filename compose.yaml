services:
  kazumi:
    build: .
    image: kazumi-web:local
    restart: unless-stopped
    init: true
    ports:
      - '${HOST_BIND:-0.0.0.0}:${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      VIDEO_CACHE_MAX_GB: '${VIDEO_CACHE_MAX_GB:-10}'
      IMAGE_CACHE_MAX_BYTES: '${IMAGE_CACHE_MAX_BYTES:-5368709120}'
      METADATA_MODE: '${METADATA_MODE:-local}'
      METADATA_AUTO_UPDATE: '${METADATA_AUTO_UPDATE:-true}'
      METADATA_UPDATE_INTERVAL_HOURS: '${METADATA_UPDATE_INTERVAL_HOURS:-24}'
      COMMENTS_CACHE_TTL_MINUTES: '${COMMENTS_CACHE_TTL_MINUTES:-30}'
      COMMENTS_CACHE_MAX_BYTES: '${COMMENTS_CACHE_MAX_BYTES:-52428800}'
      ALLOW_PRIVATE_NETWORK: 'false'
      DNS_OVER_HTTPS_URL: '${DNS_OVER_HTTPS_URL:-}'
      KAZUMI_CORE_URL: http://kazumi-core:7331
      KAZUMI_EGRESS_HOST: 0.0.0.0
      KAZUMI_EGRESS_PORT: 7332
    depends_on:
      kazumi-core:
        condition: service_healthy
    volumes:
      - kazumi-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    shm_size: 256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

  kazumi-core:
    build: ./services/kazumi-core
    image: kazumi-core:local
    restart: unless-stopped
    environment:
      KAZUMI_EGRESS_PROXY: http://kazumi:7332
    volumes:
      - kazumi-core-data:/data
    shm_size: 256m
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

volumes:
  kazumi-data:
  kazumi-core-data:
