name: Verify
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:hls
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: npm run build:ech
      - run: go test ./...
        working-directory: native/ech
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:compat:browser
      - run: npm run test:e2e
      - run: docker compose config --quiet
      - run: docker build -t kazumi-web:test .
      - run: docker run --rm --read-only kazumi-web:test test -s /etc/ssl/certs/ca-certificates.crt
      - run: docker run --rm --read-only --network none --tmpfs /tmp:mode=1777 --mount type=bind,source="$PWD/test",target=/app/test,readonly kazumi-web:test node --test test/server/local-metadata.test.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
