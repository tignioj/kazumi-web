name: Publish Docker images
on:
  push:
    tags:
      - 'v*'
  # Branch dispatches build and test both architectures without publishing.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false
env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate release tag and credentials
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || (( ${#RELEASE_TAG} > 128 )); then
            echo '::error::Use a version tag such as v1.2.3 or v1.2.3-rc.1.'
            exit 1
          fi
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo '::error::Configure DOCKERHUB_USERNAME (repository variable) and DOCKERHUB_TOKEN (repository secret).'
            exit 1
          fi
      - name: Describe build-only dispatch
        if: startsWith(github.ref, 'refs/heads/')
        run: echo 'Build-only run; Docker Hub tags will not be published.' >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: prepare
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    name: Build ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: kazumi-web
            context: .
          - name: kazumi-core
            context: services/kazumi-core
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push platform digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          platforms: linux/${{ matrix.platform.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          outputs: type=image,name=${{ env.DOCKERHUB_USERNAME }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=${{ startsWith(github.ref, 'refs/tags/') }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }},mode=max
      - name: Export digest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Upload digest
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: [kazumi-web, kazumi-core]
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Download platform digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.image }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Publish and verify the multi-platform manifest
        env:
          IMAGE: ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST_DIR: ${{ runner.temp }}/digests
        run: |
          tags=()
          while IFS= read -r tag; do
            [[ -z "$tag" ]] || tags+=(--tag "$tag")
          done <<< "$TAGS"
          sources=()
          for digest in "$DIGEST_DIR"/*; do
            sources+=("$IMAGE@sha256:$(basename "$digest")")
          done
          if (( ${#sources[@]} != 2 )); then
            echo '::error::Expected both AMD64 and ARM64 image digests.'
            exit 1
          fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          first_tag="${TAGS%%$'\n'*}"
          docker buildx imagetools inspect "$first_tag"
          docker buildx imagetools inspect --raw "$first_tag" | jq -e '
            [.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
          while IFS= read -r tag; do
            [[ -z "$tag" ]] || echo "Published: \`$tag\` (linux/amd64, linux/arm64)" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$TAGS"
